<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle X Climate</title>
  <meta name="description" content="Particle X Climate. Research Playground and Research Overwatch.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #f6f1e7;
      background:
        radial-gradient(700px 400px at 70% 20%, #3a2a22 0%, transparent 60%),
        #1c1915;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
    }
    .frame {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 36px 28px 28px;
    }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .mark { font-family: Fraunces, Georgia, serif; font-size: 22px; }
    .choose { letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: #a89880; }
    .rule { height: 1px; background: #3a342c; margin: 22px 0 0; }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(48px, 8vw, 92px);
      line-height: .9;
      letter-spacing: -.04em;
      margin: 36px 0 0;
      max-width: 12ch;
    }
    .row {
      margin-top: auto;
      padding-top: 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    a.door {
      border: 1px solid #3a342c;
      border-radius: 16px;
      padding: 22px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(255,253,248,.03);
      color: inherit;
      text-decoration: none;
    }
    a.door strong { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: clamp(20px, 2.4vw, 28px); }
    a.door span { color: #e7b5a4; font-weight: 600; white-space: nowrap; }
    a.play { background: #1f4d45; border-color: #1f4d45; }
    @media (max-width: 700px) {
      .row { grid-template-columns: 1fr; }
      .choose { display: none; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="mark">Particle X Climate</div>
      <div class="choose">Choose a door</div>
    </div>
    <div class="rule"></div>
    <h1>Two ways in.</h1>
    <div class="row">
      <a class="door play" href="playground.html"><strong>Research Playground</strong><span>Open →</span></a>
      <a class="door" href="overwatch.html"><strong>Research Overwatch</strong><span>Open →</span></a>
    </div>
  </div>
</body>
</html>
