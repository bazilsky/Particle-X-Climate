<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grant path — Particle X Climate</title>
  <meta name="description" content="Weekly Monday grant digests for independent research on solar geoengineering, climate modelling, and nuclear-war climate effects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1915;
      --muted: #5c564c;
      --paper: #f6f1e7;
      --card: #fffdf8;
      --line: #e2d8c8;
      --rust: #9a3b24;
      --rust-soft: #f3e4dc;
      --teal: #1f4d45;
      --teal-soft: #e4eeeb;
      --gold: #8a6a2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(1200px 480px at 90% -10%, #efe4cf 0%, transparent 55%),
        var(--paper);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 1.05rem;
      line-height: 1.55;
    }

    a { color: var(--rust); }

    .wrap {
      width: min(1080px, calc(100% - 2.5rem));
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 1.4rem 0 0.6rem;
      border-bottom: 1px solid var(--line);
    }

    .mark {
      font-family: Fraunces, Georgia, serif;
      font-weight: 620;
      letter-spacing: -0.02em;
      font-size: 1.15rem;
      color: inherit;
      text-decoration: none;
    }

    .mark span { color: var(--rust); }

    nav {
      display: flex;
      gap: 1.25rem;
      font-size: 0.92rem;
      font-weight: 600;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
    }

    nav a:hover { color: var(--ink); }

    .hero {
      padding: 3.2rem 0 2.4rem;
    }

    .kicker {
      margin: 0 0 0.8rem;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      line-height: 1.02;
      letter-spacing: -0.03em;
    }

    .lede {
      margin: 1.1rem 0 0;
      max-width: 38rem;
      color: var(--muted);
      font-size: 1.12rem;
    }

    section { padding: 0.5rem 0 3rem; }

    h2 {
      margin: 0 0 1.1rem;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
    }

    .week-list {
      display: grid;
      gap: 1rem;
      max-width: 28rem;
    }

    .week-btn {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.25rem 1.35rem;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .week-btn:hover {
      border-color: var(--rust);
      transform: translateY(-1px);
    }

    .week-btn .day {
      display: inline-block;
      margin-bottom: 0.55rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--teal-soft);
      color: var(--teal);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .week-btn h3 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: 1.35rem;
      color: var(--ink);
    }

    .week-btn p {
      margin: 0.4rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem 0 2.4rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 800px) {
      header { flex-direction: column; align-items: flex-start; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="mark" href="../index.html">Particle X Climate</a>
      <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">Grant path</a>
      </nav>
    </header>

    <section class="hero">
      <p class="kicker">Monday product</p>
      <h1>Grant path</h1>
      <p class="lede">Two separate searches, then one mail. Pick a week to read the digest.</p>
    </section>

    <section>
      <h2>Weeks</h2>
      <div class="week-list">
        <a class="week-btn" href="2026-09-28.html">
          <span class="day">Monday</span>
          <h3>Week of 28 September</h3>
          <p>UK/UKRI and EU/international passes merged.</p>
        </a>
      </div>
    </section>

    <footer>
      <span>Static page for Cloudflare Pages</span>
    </footer>
  </div>
</body>
</html>
