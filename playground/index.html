<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northern Hemisphere shortwave heating</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>

    :root { color-scheme: dark; --ink:#f6f1e7; --muted:#cbbfae; --line:#3a342c; --blend:#542788; }
    * { box-sizing: border-box; }
    body { margin:0; font: 16px/1.5 "Source Sans 3", "Segoe UI", sans-serif; color: var(--ink); background: radial-gradient(700px 400px at 80% 0%, #3a2a22 0%, transparent 60%), #1c1915; }
    main { max-width: 1100px; margin: 0 auto; padding: 36px 28px 64px; }
    .kicker { margin: 28px 0 8px; color: #e7b5a4; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: clamp(32px, 4vw, 48px); letter-spacing: -.03em; line-height: 1.05; margin: 0 0 8px; }
    h2 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: clamp(22px, 2.4vw, 28px); letter-spacing: -.02em; line-height: 1.15; margin: 0 0 12px; color: var(--ink); }
    p.note { margin: 0 0 22px; color: var(--muted); max-width: 68ch; }
    code { color: #f6f1e7; }
    .controls { display:grid; gap:14px; margin-bottom:8px; }
    label.row { display:grid; grid-template-columns: 110px 1fr; gap:12px; align-items:center; }
    label.row span.name { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
    input[type="range"] { width:100%; accent-color: #e7b5a4; }
    .readout { min-height: 2.8em; margin: 4px 0 18px; font-size: 15px; color: #f6f1e7; }
    .panels { display:grid; grid-template-columns: minmax(280px,.9fr) minmax(320px,1.1fr); gap:18px; }
    figure { margin:0; background:#fffdf8; color:#1c1915; border:1px solid #3a342c; border-radius:16px; padding:14px 12px 8px; }
    figcaption { font-family: Fraunces, Georgia, serif; font-size: 16px; margin: 0 4px 8px; }
    canvas { width:100%; height:auto; display:block; }
    .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin:8px 4px 2px; font-size:12px; color:#333; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .swatch { width:18px; height:3px; border-radius:1px; display:inline-block; }
    .swatch.faint { opacity:.55; }
    .scale { display:grid; grid-template-columns: auto minmax(80px,1fr) auto; gap:8px; align-items:center; margin:8px 4px 2px; font-size:12px; color:#333; }
    .bar { height:12px; border-radius:2px; background: linear-gradient(to right, rgb(0,114,178), #fff, rgb(213,94,0)); border:1px solid #e4e4e4; }
    .scale-caption, .legend-caption { margin:2px 4px 6px; font-size:12px; color:#5c564c; }
    @media (max-width: 800px) { .panels { grid-template-columns: 1fr; } label.row { grid-template-columns: 88px 1fr; } }

  </style>
</head>
<body>
  <main>
    <h1>Northern Hemisphere shortwave heating</h1>
    <h2>X<sub>dark</sub> → X<sub>light</sub></h2>
    <p class="note">
      Monthly-mean 2015 Δ shortwave heating, 0–90°N, compared to baseline, in K day⁻¹.
      UKESM run. Between training values it is a mix of the two neighbours, the same mix at every height.
    </p>
    <div class="controls">
      <label class="row">
        <span class="name" id="month-name">Month</span>
        <input id="month" type="range" min="1" max="12" step="1" value="3" aria-label="Month">
      </label>
      <label class="row">
        <span class="name" id="tau-name">τ</span>
        <input id="tau" type="range" min="0" max="5" step="0.001" value="2.631" aria-label="Bleaching time">
      </label>
    </div>
    <p class="readout" id="readout"></p>
    <div class="panels">
      <figure>
        <figcaption>Vertical profile</figcaption>
        <canvas id="profile" width="640" height="760"></canvas>
        <div class="legend" id="line-legend"></div>
        <p class="legend-caption">Line colour is which experiment. The purple line is the τ on the slider.</p>
      </figure>
      <figure>
        <figcaption>Same blend across τ, this month</figcaption>
        <canvas id="contour" width="760" height="760"></canvas>
        <div class="scale">
          <span id="scale-lo"></span>
          <div class="bar" role="img" aria-label="Heating colour scale, blue negative, white zero, orange positive"></div>
          <span id="scale-hi"></span>
        </div>
        <p class="scale-caption">Fill colour is Δ heating in K day⁻¹. Blue is negative, white is zero, orange is positive. The purple line is the slider τ.</p>
      </figure>
    </div>
  </main>
  <script src="data.js"></script>
  <script>
    const DATA = window.HEATING;
    const Z = DATA.height_km;
    const ZMIN = 8;
    const ZMAX = 20;
    const NODES = DATA.cases.slice(0, 5).map((c) => c.tau_days);
    const MONTH = document.getElementById("month");
    const TAU = document.getElementById("tau");
    const READOUT = document.getElementById("readout");
    const LINE_LEGEND = document.getElementById("line-legend");
    const SCALE_LO = document.getElementById("scale-lo");
    const SCALE_HI = document.getElementById("scale-hi");
    DATA.cases.forEach((c) => {
      const item = document.createElement("span");
      const swatch = document.createElement("i");
      swatch.className = "swatch faint";
      swatch.style.background = c.color;
      item.append(swatch, document.createTextNode(c.label));
      LINE_LEGEND.append(item);
    });
    const blendItem = document.createElement("span");
    const blendSwatch = document.createElement("i");
    blendSwatch.className = "swatch";
    blendSwatch.style.background = "#542788";
    blendSwatch.style.height = "4px";
    blendItem.append(blendSwatch, document.createTextNode("slider τ"));
    LINE_LEGEND.append(blendItem);
    const MONTH_NAME = document.getElementById("month-name");
    const TAU_NAME = document.getElementById("tau-name");

    function tauFromSlider(u) {
      if (u <= 0) return NODES[0];
      if (u >= 5) return Infinity;
      const seg = Math.min(4, Math.floor(u));
      const frac = u - seg;
      if (seg < 4) {
        const a = Math.log10(NODES[seg]);
        const b = Math.log10(NODES[seg + 1]);
        return 10 ** (a + frac * (b - a));
      }
      if (frac >= 0.999) return Infinity;
      const excess = frac / (1 - frac);
      return 100 * 10 ** excess;
    }

    function weights(tauDays) {
      const w = [0, 0, 0, 0, 0, 0];
      if (!Number.isFinite(tauDays)) {
        w[5] = 1;
        return w;
      }
      if (tauDays <= NODES[0]) {
        w[0] = 1;
        return w;
      }
      const x = Math.log10(tauDays);
      const xs = NODES.map(Math.log10);
      if (x <= xs[xs.length - 1]) {
        let i = 0;
        while (i < xs.length - 2 && x > xs[i + 1]) i += 1;
        const span = xs[i + 1] - xs[i];
        const frac = span === 0 ? 0 : (x - xs[i]) / span;
        w[i] = 1 - frac;
        w[i + 1] = frac;
        return w;
      }
      const excess = x - xs[xs.length - 1];
      const frac = excess / (excess + 1);
      w[4] = 1 - frac;
      w[5] = frac;
      return w;
    }

    function mix(w, monthIndex) {
      const n = Z.length;
      const out = new Array(n).fill(0);
      for (let i = 0; i < 6; i += 1) {
        if (w[i] === 0) continue;
        const col = DATA.profiles[i][monthIndex];
        for (let k = 0; k < n; k += 1) out[k] += w[i] * col[k];
      }
      return out;
    }

    function tauLabel(tauDays) {
      if (!Number.isFinite(tauDays)) return "X_dark";
      if (tauDays <= NODES[0] * 1.001) return "X_light";
      if (tauDays < 10) return tauDays.toPrecision(2) + " days";
      if (tauDays < 1000) return tauDays.toPrecision(3) + " days";
      const exp = Math.floor(Math.log10(tauDays));
      const mant = tauDays / 10 ** exp;
      return mant.toFixed(1) + "×10^" + exp + " days";
    }

    function monthRange(monthIndex) {
      let lo = Infinity;
      let hi = -Infinity;
      for (let i = 0; i < 6; i += 1) {
        for (const v of DATA.profiles[i][monthIndex]) {
          if (v < lo) lo = v;
          if (v > hi) hi = v;
        }
      }
      const pad = 0.06 * Math.max(hi - lo, 0.05);
      return { lo: Math.min(lo, 0) - pad, hi: Math.max(hi, 0) + pad };
    }

    function color(v, lo, hi) {
      const span = Math.max(Math.abs(lo), Math.abs(hi), 1e-6);
      const t = Math.max(-1, Math.min(1, v / span));
      if (t >= 0) {
        const u = t;
        return [Math.round(255 - u * (255 - 213)), Math.round(255 - u * (255 - 94)), Math.round(255 - u * (255 - 0))];
      }
      const u = -t;
      return [Math.round(255 - u * (255 - 0)), Math.round(255 - u * (255 - 114)), Math.round(255 - u * (255 - 178))];
    }

    function setup(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.clientWidth || canvas.width;
      const height = Math.round(width * (canvas.height / canvas.width));
      canvas.style.height = height + "px";
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width, height };
    }

    function yOf(z, top, height) {
      return top + (1 - (z - ZMIN) / (ZMAX - ZMIN)) * height;
    }

    function drawProfile(view, series, scale, blend) {
      const { ctx, width, height } = view;
      const left = 58;
      const right = 18;
      const top = 12;
      const bottom = 44;
      const pw = width - left - right;
      const ph = height - top - bottom;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#f2f2f2";
      ctx.fillRect(left, yOf(12, top, ph), pw, yOf(10, top, ph) - yOf(12, top, ph));
      const xOf = (v) => left + ((v - scale.lo) / (scale.hi - scale.lo)) * pw;
      ctx.strokeStyle = "#9a9a9a";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(xOf(0), top);
      ctx.lineTo(xOf(0), top + ph);
      ctx.stroke();
      DATA.cases.forEach((c, i) => {
        ctx.beginPath();
        series[i].forEach((v, k) => {
          const x = xOf(v);
          const y = yOf(Z[k], top, ph);
          if (k === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = c.color;
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = 1.4;
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
      ctx.beginPath();
      blend.forEach((v, k) => {
        const x = xOf(v);
        const y = yOf(Z[k], top, ph);
        if (k === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "#542788";
      ctx.lineWidth = 2.4;
      ctx.stroke();
      ctx.fillStyle = "#333";
      ctx.font = "12px Helvetica, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("K day⁻¹", left + pw / 2, height - 8);
      ctx.save();
      ctx.translate(14, top + ph / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("Height (km)", 0, 0);
      ctx.restore();
      ctx.textAlign = "right";
      ctx.fillStyle = "#555";
      for (const tick of [8, 12, 16, 20]) {
        const y = yOf(tick, top, ph);
        ctx.fillText(String(tick), left - 6, y + 4);
      }
      const ticks = 4;
      ctx.textAlign = "center";
      for (let i = 0; i <= ticks; i += 1) {
        const v = scale.lo + (i / ticks) * (scale.hi - scale.lo);
        ctx.fillText(v.toFixed(2), xOf(v), top + ph + 16);
      }
    }

    function drawContour(view, monthIndex, sliderU, scale) {
      const { ctx, width, height } = view;
      const left = 58;
      const right = 18;
      const top = 12;
      const bottom = 44;
      const pw = width - left - right;
      const ph = height - top - bottom;
      const cols = 160;
      const edges = [ZMIN];
      for (let k = 0; k < Z.length - 1; k += 1) edges.push(0.5 * (Z[k] + Z[k + 1]));
      edges.push(ZMAX);
      ctx.clearRect(0, 0, width, height);
      for (let col = 0; col < cols; col += 1) {
        const u = (col / (cols - 1)) * 5;
        const column = mix(weights(tauFromSlider(u)), monthIndex);
        const x0 = left + (col / cols) * pw;
        const x1 = left + ((col + 1) / cols) * pw;
        for (let k = 0; k < Z.length; k += 1) {
          const yTop = yOf(edges[k + 1], top, ph);
          const yBot = yOf(edges[k], top, ph);
          const [r, g, b] = color(column[k], scale.lo, scale.hi);
          ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
          ctx.fillRect(x0, yTop, x1 - x0 + 0.5, yBot - yTop);
        }
      }
      const x = left + (sliderU / 5) * pw;
      ctx.strokeStyle = "#542788";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, top);
      ctx.lineTo(x, top + ph);
      ctx.stroke();
      ctx.fillStyle = "#333";
      ctx.font = "12px Helvetica, Arial, sans-serif";
      ctx.textAlign = "center";
      const ticks = ["light", "1 d", "10 d", "30 d", "100 d", "dark"];
      ticks.forEach((label, i) => {
        const x = left + (i / 5) * pw;
        ctx.textAlign = i === 0 ? "left" : i === ticks.length - 1 ? "right" : "center";
        ctx.fillText(label, x, top + ph + 16);
      });
      ctx.textAlign = "center";
      ctx.fillText("τ", left + pw / 2, height - 6);
      ctx.save();
      ctx.translate(14, top + ph / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("Height (km)", 0, 0);
      ctx.restore();
      ctx.textAlign = "right";
      ctx.fillStyle = "#555";
      for (const tick of [8, 12, 16, 20]) {
        ctx.fillText(String(tick), left - 6, yOf(tick, top, ph) + 4);
      }
    }

    function render() {
      const monthIndex = Number(MONTH.value) - 1;
      const sliderU = Number(TAU.value);
      const tauDays = tauFromSlider(sliderU);
      const w = weights(tauDays);
      const monthName = DATA.months[monthIndex];
      MONTH_NAME.textContent = monthName;
      TAU_NAME.textContent = tauLabel(tauDays);
      const parts = DATA.cases
        .map((c, i) => ({ label: c.label, w: w[i] }))
        .filter((p) => p.w > 0.005);
      const exact = parts.length === 1 && parts[0].w > 0.999;
      READOUT.textContent = exact
        ? monthName + " · " + parts[0].label + " · this is the UKESM monthly mean."
        : monthName + " · " + parts.map((p) => p.w.toFixed(2) + " × " + p.label).join(" + ") + ". Mix of those monthly means, not a UKESM run at this τ.";
      const scale = monthRange(monthIndex);
      const span = Math.max(Math.abs(scale.lo), Math.abs(scale.hi), 1e-6);
      SCALE_LO.textContent = (-span).toFixed(2);
      SCALE_HI.textContent = span.toFixed(2);
      const series = DATA.cases.map((_, i) => DATA.profiles[i][monthIndex]);
      drawProfile(setup(document.getElementById("profile")), series, scale, mix(w, monthIndex));
      drawContour(setup(document.getElementById("contour")), monthIndex, sliderU, scale);
    }

    MONTH.addEventListener("input", render);
    TAU.addEventListener("input", render);
    window.addEventListener("resize", render);
    render();
  </script>
</body>
</html>
