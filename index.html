<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle X Climate</title>
  <meta name="description" content="Particle X Climate. Research Playground and Research Overwatch.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Source Sans 3", "Segoe UI", sans-serif; color: #f3ead7; background: #14120e; }
    .split { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    a.half {
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 36px 40px 32px; text-decoration: none; color: #f3ead7; min-height: 100vh;
    }
    a.play { background: #1f4d45; }
    a.watch { background: #14120e; }
    .mark, h1 { font-family: Fraunces, Georgia, serif; font-weight: 500; }
    .mark { font-size: 18px; }
    h1 { font-size: clamp(40px, 5vw, 64px); line-height: .95; letter-spacing: -.03em; margin: 0; max-width: 10ch; }
    .go { color: #e7b5a4; font-weight: 600; }
    @media (max-width: 700px) {
      .split { grid-template-columns: 1fr; }
      a.half { min-height: 50vh; }
    }
  </style>
</head>
<body>
  <div class="split">
    <a class="half play" href="playground.html">
      <div class="mark">Particle X Climate</div>
      <h1>Research Playground</h1>
      <div class="go">Open →</div>
    </a>
    <a class="half watch" href="overwatch.html">
      <div class="mark"></div>
      <h1>Research Overwatch</h1>
      <div class="go">Open →</div>
    </a>
  </div>
</body>
</html>
